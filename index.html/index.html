<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spesa Smart Milano</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui} body{margin:0;background:#f6f7fb;padding:12px}
h1{font-size:22px;margin:4px 0} .card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}
input,select,button,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin:6px 0}
button{background:#111;color:#fff;border:none;font-weight:700} button.sec{background:#eef2ff;color:#111}
.row{display:flex;gap:8px} .row>*{flex:1}
.chip{display:inline-block;background:#eef2ff;padding:6px 10px;border-radius:20px;margin:3px}
.chip b{color:red;cursor:pointer;margin-left:6px}
#map{height:300px;border-radius:12px;margin-top:10px}
.store{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0}
.store.best{border:2px solid #16a34a;background:#f0fdf4}
.store.multi{border:2px solid #2563eb;background:#eff6ff}
.badge{background:#16a34a;color:#fff;padding:3px 8px;border-radius:20px;font-size:12px}
.badge.blue{background:#2563eb}
small{color:#666}
.verdict{font-size:18px;font-weight:800;padding:12px;border-radius:12px;margin:10px 0;text-align:center}
.verdict.single{background:#f0fdf4;color:#166534}
.verdict.multi{background:#eff6ff;color:#1e40af}
</style>
</head>
<body>
<h1>🛒 Spesa Smart Milano</h1>
<p><small>Milano - 1 tappa VS più tappe + Benzina</small></p>

<div class="card">
  <h3>1. Dove sei a Milano?</h3>
  <select id="zona">
    <option value="45.4642,9.19">Duomo / Centro</option>
    <option value="45.458,9.181">Navigli / Porta Genova</option>
    <option value="45.486,9.187">Isola / Porta Garibaldi</option>
    <option value="45.452,9.214">Porta Romana / Lodi</option>
    <option value="45.515,9.21">Bicocca / Niguarda</option>
    <option value="45.476,9.226">Città Studi / Lambrate</option>
    <option value="45.465,9.151">San Siro / Lotto</option>
    <option value="45.44,9.17">Barona / Famagosta</option>
  </select>
  <button class="sec" onclick="gps()">📍 Usa il mio GPS invece</button>
</div>

<div class="card">
  <h3>2. Lista</h3>
  <div class="row"><input id="prodotto" placeholder="Es. Latte 1L"><button onclick="aggiungi()">+ Aggiungi</button></div>
  <div id="lista"></div>
  <div class="row"><button class="sec" onclick="preset('base')">Lista Base</button><button class="sec" onclick="preset('colazione')">Colazione</button><button class="sec" onclick="pulisci()">Svuota</button></div>
</div>

<div class="card">
  <h3>3. Auto</h3>
  <div class="row">
    <select id="auto"><option value="15">Benzina 15 km/l</option><option value="20">Ibrida 20 km/l</option><option value="12">Diesel 12 km/l</option><option value="18">Metano 18 km/l</option><option value="999">A piedi / Metro (0 benzina)</option></select>
    <input id="prezzoBenz" type="number" step="0.01" value="1.78">
  </div>
  <small>Se vai a piedi/metro scegli l'ultima, così calcola solo la spesa senza benzina</small>
</div>

<div class="card">
  <button onclick="calcola()">🔍 CALCOLA: 1 TAPPA VS PIÙ TAPPE</button>
  <div id="map"></div>
  <div id="risultato"></div>
</div>

<div class="card">
  <h3>4. Prezzi Milano</h3>
  <textarea id="prezziJson" rows="6" style="width:100%;padding:10px;border-radius:10px"></textarea>
  <button class="sec" onclick="salvaPrezzi()">💾 Salva prezzi</button>
</div>

<script>
const NEGOZI = [
  {nome:"Esselunga Via Ripamonti", lat:45.438, lng:9.203},
  {nome:"Esselunga Viale Papiniano", lat:45.457, lng:9.171},
  {nome:"Carrefour Portello", lat:45.482, lng:9.154},
  {nome:"Coop Piazza Lodi", lat:45.450, lng:9.214},
  {nome:"Conad CityLife", lat:45.475, lng:9.156},
  {nome:"Lidl Via Padova", lat:45.490, lng:9.224},
  {nome:"Eurospin Via Mecenate", lat:45.458, lng:9.250},
  {nome:"MD Via Gallarate", lat:45.494, lng:9.137},
  {nome:"Penny Via Lorenteggio", lat:45.449, lng:9.158},
  {nome:"Iperal Bicocca", lat:45.516, lng:9.208}
];
let DB = JSON.parse(localStorage.getItem('spesa_prezzi_milano')||'null') || {
  "latte 1l": {"Esselunga Via Ripamonti":1.39,"Esselunga Viale Papiniano":1.39,"Carrefour Portello":1.55,"Coop Piazza Lodi":1.49,"Conad CityLife":1.45,"Lidl Via Padova":1.19,"Eurospin Via Mecenate":1.15,"MD Via Gallarate":1.29,"Penny Via Lorenteggio":1.25,"Iperal Bicocca":1.35},
  "pane": {"Esselunga Via Ripamonti":1.10,"Esselunga Viale Papiniano":1.10,"Carrefour Portello":1.30,"Coop Piazza Lodi":1.20,"Conad CityLife":1.20,"Lidl Via Padova":0.89,"Eurospin Via Mecenate":0.85,"MD Via Gallarate":0.99,"Penny Via Lorenteggio":0.95,"Iperal Bicocca":1.05},
  "pasta 500g": {"Esselunga Via Ripamonti":0.89,"Esselunga Viale Papiniano":0.89,"Carrefour Portello":1.05,"Coop Piazza Lodi":0.95,"Conad CityLife":0.95,"Lidl Via Padova":0.75,"Eurospin Via Mecenate":0.69,"MD Via Gallarate":0.79,"Penny Via Lorenteggio":0.79,"Iperal Bicocca":0.85},
  "pollo 1kg": {"Esselunga Via Ripamonti":5.50,"Esselunga Viale Papiniano":5.50,"Carrefour Portello":6.20,"Coop Piazza Lodi":5.90,"Conad CityLife":5.90,"Lidl Via Padova":4.99,"Eurospin Via Mecenate":4.79,"MD Via Gallarate":5.20,"Penny Via Lorenteggio":5.10,"Iperal Bicocca":5.40},
  "pomodori 1kg": {"Esselunga Via Ripamonti":2.10,"Esselunga Viale Papiniano":2.10,"Carrefour Portello":2.60,"Coop Piazza Lodi":2.40,"Conad CityLife":2.40,"Lidl Via Padova":1.89,"Eurospin Via Mecenate":1.79,"MD Via Gallarate":1.99,"Penny Via Lorenteggio":1.95,"Iperal Bicocca":2.00},
  "uova 10": {"Esselunga Via Ripamonti":2.70,"Esselunga Viale Papiniano":2.70,"Carrefour Portello":3.10,"Coop Piazza Lodi":2.90,"Conad CityLife":2.90,"Lidl Via Padova":2.29,"Eurospin Via Mecenate":2.19,"MD Via Gallarate":2.50,"Penny Via Lorenteggio":2.45,"Iperal Bicocca":2.60},
  "caffè 250g": {"Esselunga Via Ripamonti":4.20,"Esselunga Viale Papiniano":4.20,"Carrefour Portello":4.80,"Coop Piazza Lodi":4.50,"Conad CityLife":4.50,"Lidl Via Padova":3.69,"Eurospin Via Mecenate":3.49,"MD Via Gallarate":3.99,"Penny Via Lorenteggio":3.89,"Iperal Bicocca":4.10}
};
document.getElementById('prezziJson').value = JSON.stringify(DB,null,2);
let lista = JSON.parse(localStorage.getItem('spesa_lista_milano')||'["latte 1l","pasta 500g","pollo 1kg"]');
let miaPos = {lat:45.4642,lng:9.19};
let map, markers=[];
function save(){ localStorage.setItem('spesa_lista_milano', JSON.stringify(lista)); }
function render(){ document.getElementById('lista').innerHTML = lista.map((p,i)=>`<span class="chip">${p}<b onclick="lista.splice(${i},1);save();render()">x</b></span>`).join('')||'<small>Lista vuota</small>'; }
function aggiungi(){ let v=document.getElementById('prodotto').value.trim().toLowerCase(); if(!v) return; lista.push(v); document.getElementById('prodotto').value=''; save(); render(); }
function pulisci(){ lista=[]; save(); render(); }
function preset(t){ lista = t==='base'?["latte 1l","pasta 500g","pollo 1kg","pomodori 1kg"]:["latte 1l","caffè 250g","uova 10","pane"]; save(); render(); }
function salvaPrezzi(){ try{ DB=JSON.parse(document.getElementById('prezziJson').value); localStorage.setItem('spesa_prezzi_milano', JSON.stringify(DB)); alert('Prezzi salvati!'); }catch(e){ alert('JSON non valido'); } }
function gps(){ if(!navigator.geolocation) return alert('GPS non disponibile'); navigator.geolocation.getCurrentPosition(p=>{ miaPos={lat:p.coords.latitude,lng:p.coords.longitude}; alert('Posizione presa! Ora premi CALCOLA'); },()=>alert('Consenti GPS')); }
function distKm(a,b){ const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180; const h=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

function calcola(){
  let z=document.getElementById('zona').value.split(','); 
  // usa la zona scelta
  miaPos={lat:parseFloat(z[0]),lng:parseFloat(z[1])};
  if(lista.length===0) return alert('Aggiungi un prodotto');
  let consumo=parseFloat(document.getElementById('auto').value);
  let prezzoB=parseFloat(document.getElementById('prezzoBenz').value);
  let costoKm = consumo>=900 ? 0 : (1/consumo*prezzoB); // euro per km

  // --- 1. MIGLIORE SINGOLO ---
  let singoli = NEGOZI.map(n=>{
    let tot=0; lista.forEach(p=>{ tot += (DB[p] && DB[p][n.nome] ? DB[p][n.nome] : 2.5); });
    let d = distKm(miaPos,n);
    let benz = d*2*costoKm;
    return {...n, spesa:tot, dist:d, totale:tot+benz, benz};
  });
  singoli.sort((a,b)=>a.totale-b.totale);
  let bestSingle = singoli[0];

  // --- 2. MIGLIORE MULTI-TAPPA: ogni prodotto dove costa meno ---
  let piano = {}; // negozio -> [prodotti]
  let spesaMulti = 0; let dettaglioMulti = [];
  lista.forEach(p=>{
    let bestN=null, bestP=999;
    NEGOZI.forEach(n=>{ let pr = DB[p] && DB[p][n.nome] ? DB[p][n.nome] : 999; if(pr<bestP){bestP=pr; bestN=n.nome;} });
    if(!piano[bestN]) piano[bestN]=[];
    piano[bestN].push(`${p} €${bestP.toFixed(2)}`);
    spesaMulti+=bestP;
    dettaglioMulti.push(`${p} → ${bestN} €${bestP.toFixed(2)}`);
  });
  let negoziMulti = Object.keys(piano).map(nome=> NEGOZI.find(n=>n.nome===nome));
  // Se sono più di 3 negozi, teniamo solo i 2 che fanno risparmiare di più? Per semplicità teniamo max 3 più vicini tra loro
  // Ordine percorso: greedy dal più vicino a casa
  let ordine=[]; let pos={...miaPos}; let rest=[...negoziMulti];
  while(rest.length){ rest.sort((a,b)=>distKm(pos,a)-distKm(pos,b)); let nxt=rest.shift(); ordine.push(nxt); pos=nxt; }
  let kmMulti=0; let cur={...miaPos};
  ordine.forEach(n=>{ kmMulti+=distKm(cur,n); cur=n; });
  kmMulti+=distKm(cur,miaPos); // ritorno a casa
  let benzMulti = kmMulti*costoKm;
  let totaleMulti = spesaMulti + benzMulti;

  // --- 3. VERDETTO ---
  let convieneMulti = totaleMulti < bestSingle.totale;
  let risparmio = Math.abs(bestSingle.totale - totaleMulti);

  // --- MAPPA ---
  if(!map){ map=L.map('map').setView([miaPos.lat,miaPos.lng],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map); }
  map.setView([miaPos.lat,miaPos.lng],12);
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  let casa = L.marker([miaPos.lat,miaPos.lng]).addTo(map).bindPopup('🏠 TU SEI QUI'); markers.push(casa);
  // Se conviene multi, disegna percorso multi in blu, altrimenti percorso singolo in verde
  if(convieneMulti){
    let percorso=[[miaPos.lat,miaPos.lng],...ordine.map(o=>[o.lat,o.lng]),[miaPos.lat,miaPos.lng]];
    let linea=L.polyline(percorso,{color:'blue',weight:4}).addTo(map); markers.push(linea);
    ordine.forEach((r,i)=>{ let m=L.marker([r.lat,r.lng]).addTo(map).bindPopup(`<b>${i+1}° TAPPA: ${r.nome}</b><br>${piano[r.nome].join('<br>')}`); markers.push(m); });
  } else {
    let m=L.marker([bestSingle.lat,bestSingle.lng]).addTo(map).bindPopup(`<b>${bestSingle.nome}</b><br>Totale €${bestSingle.totale.toFixed(2)}`); markers.push(m);
    let linea=L.polyline([[miaPos.lat,miaPos.lng],[bestSingle.lat,bestSingle.lng],[miaPos.lat,miaPos.lng]],{color:'green',weight:4}).addTo(map); markers.push(linea);
  }

  let html = '';
  if(convieneMulti){
    html += `<div class="verdict multi">🏆 CONVIENE FARE ${ordine.length} TAPPE<br>Risparmi €${risparmio.toFixed(2)} anche con la benzina!</div>`;
  } else {
    html += `<div class="verdict single">🏆 CONVIENE ANDARE IN 1 SOLO SUPERMERCATO<br>Risparmi €${risparmio.toFixed(2)} rispetto a fare più tappe</div>`;
  }
  html += `
  <div class="store best"><b>🛒 OPZIONE 1 TAPPA: ${bestSingle.nome}</b><br>
  Spesa: €${bestSingle.spesa.toFixed(2)} + Benzina: €${bestSingle.benz.toFixed(2)} (${(bestSingle.dist*2).toFixed(1)} km A/R)<br>
  <b>TOTALE: €${bestSingle.totale.toFixed(2)}</b><br>
  <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(bestSingle.nome+' Milano')}" target="_blank">🧭 Naviga →</a></div>

  <div class="store multi"><b>🔀 OPZIONE PIÙ TAPPE: ${ordine.map(o=>o.nome).join(' → ')}</b><br>
  Spesa (ogni prodotto dove costa meno): €${spesaMulti.toFixed(2)} + Benzina: €${benzMulti.toFixed(2)} (${kmMulti.toFixed(1)} km totali)<br>
  <b>TOTALE: €${totaleMulti.toFixed(2)}</b><br>
  <small>${dettaglioMulti.join('<br>')}</small><br>
  <a href="https://www.google.com/maps/dir/?api=1&origin=${miaPos.lat},${miaPos.lng}&destination=${encodeURIComponent(ordine[ordine.length-1].nome+' Milano')}&waypoints=${ordine.slice(0,-1).map(o=>encodeURIComponent(o.nome+' Milano')).join('|')}" target="_blank">🧭 Naviga giro completo →</a></div>

  <h3>📊 Tutti in 1 tappa</h3>${singoli.map(r=>`<div>${r.nome} - Spesa €${r.spesa.toFixed(2)} + Benzina €${r.benz.toFixed(2)} = <b>€${r.totale.toFixed(2)}</b></div>`).join('')}`;
  document.getElementById('risultato').innerHTML = html;
}
render();
</script>
</body>
</html>
