function creaDB(){let db={};Object.keys(PREZZI).forEach(p=>{db[p]={};NEGOZI.forEach((n,i)=>{let base=PREZZI[p];let v=[0,0,0.15,0.08,0.05,-0.15,-0.20,-0.10,-0.08,0,0.05,0.12,-0.10,-0.15,0.02,-0.05,0.10,0,0.08,-0.12,0.05,-0.08,0.03,0.10,-0.15,0.06,-0.02,0.12,-0.10,0.04,0.08,-0.05,0.10,-0.12,0.02,0.06,0.08][i]||0;if(base>10)v=v*5;if(base>5)v=v*2;db[p][n.nome]=Math.max(0.5,+(base+v).toFixed(2));});});return db;}

function distKm(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function prezzoDi(p,negozio){if(DB[p]&&DB[p][negozio])return{val:DB[p][negozio],stimato:false};let k=Object.keys(DB).find(k=>k.includes(p)||p.includes(k));if(k&&DB[k][negozio])return{val:DB[k][negozio],stimato:true};return{val:3.50,stimato:true};}
function calcola(){try{let z=document.getElementById('zona').value.split(',');miaPos={lat:parseFloat(z[0]),lng:parseFloat(z[1])};if(lista.length===0)return alert('Aggiungi un prodotto');let consumo=parseFloat(document.getElementById('auto').value);let prezzoB=parseFloat(document.getElementById('prezzoBenz').value)||1.78;let costoKm=consumo>=900?0:(1/consumo*prezzoB);let avvisi=[];let singoli=NEGOZI.map(n=>{let tot=0;lista.forEach(p=>{let r=prezzoDi(p,n.nome);tot+=r.val;if(r.stimato&&!avvisi.includes(p))avvisi.push(p);});let d=distKm(miaPos,n);let benz=d*2*costoKm;return{...n,spesa:tot,dist:d,totale:tot+benz,benz};});singoli.sort((a,b)=>a.totale-b.totale);let bestSingle=singoli[0];let piano={};let spesaMulti=0;let dettaglioMulti=[];lista.forEach(p=>{let bestN=null,bestP=999;NEGOZI.forEach(n=>{let pr=prezzoDi(p,n.nome).val;if(pr<bestP){bestP=pr;bestN=n.nome;}});if(!piano[bestN])piano[bestN]=[];piano[bestN].push(`${p} €${bestP.toFixed(2)}`);spesaMulti+=bestP;dettaglioMulti.push(`${p} → ${bestN} €${bestP.toFixed(2)}`);});let negoziMulti=Object.keys(piano).map(nome=>NEGOZI.find(n=>n.nome===nome));let ordine=[];let pos={...miaPos};let rest=[...negoziMulti];while(rest.length){rest.sort((a,b)=>distKm(pos,a)-distKm(pos,b));let nxt=rest.shift();ordine.push(nxt);pos=nxt;}let kmMulti=0;let cur={...miaPos};ordine.forEach(n=>{kmMulti+=distKm(cur,n);cur=n;});kmMulti+=distKm(cur,miaPos);let benzMulti=kmMulti*costoKm;let totaleMulti=spesaMulti+benzMulti;let convieneMulti=totaleMulti<bestSingle.totale;let risparmio=Math.abs(bestSingle.totale-totaleMulti);if(!map){map=L.map('map').setView([miaPos.lat,miaPos.lng],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);}map.setView([miaPos.lat,miaPos.lng],11);markers.forEach(m=>map.removeLayer(m));markers=[];markers.push(L.marker([miaPos.lat,miaPos.lng]).addTo(map).bindPopup('🏠 TU SEI QUI'));if(convieneMulti){let percorso=[[miaPos.lat,miaPos.lng],...ordine.map(o=>[o.lat,o.lng]),[miaPos.lat,miaPos.lng]];markers.push(L.polyline(percorso,{color:'blue',weight:4}).addTo(map));ordine.forEach((r,i)=>{markers.push(L.marker([r.lat,r.lng]).addTo(map).bindPopup(`<b>${i+1}° TAPPA: ${r.nome}</b><br>${piano[r.nome].join('<br>')}`));});}else{markers.push(L.marker([bestSingle.lat,bestSingle.lng]).addTo(map).bindPopup(`<b>${bestSingle.nome}</b>`));markers.push(L.polyline([[miaPos.lat,miaPos.lng],[bestSingle.lat,bestSingle.lng],[miaPos.lat,miaPos.lng]],{color:'green',weight:4}).addTo(map));}let html='';if(avvisi.length)html+=`<div class="warn">⚠️ Prezzo stimato per: <b>${avvisi.join(', ')}</b></div>`;html+=convieneMulti?`<div class="verdict multi">🏆 CONVIENE FARE ${ordine.length} TAPPE<br>Risparmi €${risparmio.toFixed(2)} anche con la benzina!</div>`:`<div class="verdict single">🏆 CONVIENE 1 SOLO SUPERMERCATO<br>Risparmi €${risparmio.toFixed(2)} rispetto a più tappe</div>`;html+=`<div class="store best"><b>🛒 1 TAPPA: ${bestSingle.nome}</b><br>Spesa €${bestSingle.spesa.toFixed(2)} + Benzina €${bestSingle.benz.toFixed(2)} (${(bestSingle.dist*2).toFixed(1)} km A/R)<br><b>TOTALE €${bestSingle.totale.toFixed(2)}</b><br><a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(bestSingle.nome)}" target="_blank">🧭 Naviga →</a></div><div class="store multi"><b>🔀 PIÙ TAPPE: ${ordine.map(o=>o.nome).join(' → ')}</b><br>Spesa €${spesaMulti.toFixed(2)} + Benzina €${benzMulti.toFixed(2)} (${kmMulti.toFixed(1)} km)<br><b>TOTALE €${totaleMulti.toFixed(2)}</b><br><small>${dettaglioMulti.join('<br>')}</small></div>`;document.getElementById('risultato').innerHTML=html;}catch(e){alert('Errore: '+e.message);}}
